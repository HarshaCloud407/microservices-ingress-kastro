apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
name: techsolutions-ingress
namespace: default
annotations:
nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
ingressClassName: nginx
rules:
- host: hariawsdevops.online
http:
paths:
- path: /
pathType: Prefix
backend:
service:
name: techsolutions-service
port:
number: 80
